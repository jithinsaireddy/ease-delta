name: publish to PyPI
# Run by hand (Actions -> "publish to PyPI" -> Run workflow) after a release is tagged.
# Uses PyPI trusted publishing: no token is stored anywhere. One-time setup on pypi.org:
#   Account -> Publishing -> Add a new pending publisher -> PyPI project name "ease-delta",
#   owner "jithinsaireddy", repository "ease-delta", workflow "publish-pypi.yml", environment "pypi".
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade build twine
      - run: python -m build
      - run: python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
