name: tests
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install (CPU torch)
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.6"
          pip install -e ".[dev]"
      - name: Lint
        run: ruff check src scripts tests
      - name: Tests (no model, no network needed)
        env:
          EASE_DEVICE: cpu
          HF_HUB_OFFLINE: "1"
        run: pytest -q
      - name: The report regenerates from the published evidence
        run: |
          python scripts/make_report.py --out /tmp/RESULTS.md
          diff <(tail -n +4 /tmp/RESULTS.md) <(tail -n +4 docs/RESULTS.md)
