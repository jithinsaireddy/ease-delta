name: Idea or workflow
description: A workflow you want to track, a source to import from, or a feature
labels: [idea]
body:
  - type: textarea
    id: need
    attributes:
      label: What you are trying to get done
      description: The task, what must be true before it can happen, and where the messages come from.
    validations: {required: true}
  - type: textarea
    id: today
    attributes:
      label: How you do it today, and what goes wrong
