name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what you expected
    validations: {required: true}
  - type: textarea
    id: repro
    attributes:
      label: How to reproduce
      description: The smallest code or commands that show it.
      render: python
    validations: {required: true}
  - type: input
    id: versions
    attributes:
      label: Versions
      placeholder: "ease-delta 0.2.0, Python 3.12, torch 2.x, transformers 5.x, macOS / Linux / Windows"
