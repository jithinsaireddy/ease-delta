[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ease-delta"
version = "0.2.0"
description = "Keep decisions current as the facts change: an exact, incremental engine around a claim-vs-evidence reader"
readme = "README.md"
requires-python = ">=3.11"
keywords = ["nli", "fact-verification", "modernbert", "incremental-computation", "decision-support", "rag"]
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = [
  "torch>=2.6",
  "transformers>=4.48",
  "datasets>=4.0",
  "huggingface_hub",
  "safetensors",
  "numpy",
  "scipy",
  "pyyaml",
  "fastapi",
  "uvicorn",
  "pydantic>=2",
]

[project.urls]
Homepage = "https://jithinsaireddy.github.io/ease-delta/"
Documentation = "https://github.com/jithinsaireddy/ease-delta/blob/main/docs/README.md"
Source = "https://github.com/jithinsaireddy/ease-delta"
Models = "https://huggingface.co/jithinpothireddy21/ease-delta"
Changelog = "https://github.com/jithinsaireddy/ease-delta/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = ["pytest", "hypothesis", "httpx", "ruff"]

[project.scripts]
ease = "ease.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ease = ["service/*.html"]

[tool.ruff.lint]
# Correctness rules, named here so the outcome does not depend on a ruff version's defaults.
select = ["E9", "F", "B023"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
  "slow: tests that load the trained model or take more than a few seconds",
]
