[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ease-delta"
version = "0.1.0"
description = "EASE-Delta: revision-aware decision computation (versioned evidence, incremental neural-symbolic inference, gated self-evolution)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
  "torch>=2.6",
  "transformers>=4.48",
  "datasets>=4.0",
  "safetensors",
  "numpy",
  "scipy",
  "pyyaml",
  "fastapi",
  "uvicorn",
  "pydantic>=2",
]

[project.optional-dependencies]
dev = ["pytest", "hypothesis", "httpx", "ruff"]

[project.scripts]
ease = "ease.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ease = ["service/*.html"]

[tool.ruff.lint]
# Correctness rules, named here so the outcome does not depend on a ruff version's defaults.
select = ["E9", "F", "B023"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
  "slow: tests that load the trained model or take more than a few seconds",
]
