<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Please confirm</title>
<style>
  :root { --bg: #f6f5f1; --panel: #ffffff; --ink: #1c1b18; --muted: #6a675f; --line: #e2dfd6; --accent: #2b4c7e; --accent-ink: #ffffff; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #151513; --panel: #1e1e1b; --ink: #ecebe6; --muted: #a09d94; --line: #33322d; --accent: #8fb3ea; --accent-ink: #101418; }
  }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 560px; margin: 40px auto; padding: 0 16px; }
  section { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 20px; }
  h1 { font-size: 18px; margin: 0 0 12px; }
  blockquote { margin: 12px 0; padding: 12px 14px; border-left: 3px solid var(--accent); background: var(--bg); border-radius: 0 7px 7px 0; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
  button { font: inherit; background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 7px; padding: 8px 16px; cursor: pointer; font-weight: 600; }
  button.quiet { background: transparent; color: var(--accent); border: 1px solid var(--line); font-weight: 500; }
  textarea { width: 100%; box-sizing: border-box; font: inherit; color: inherit; background: var(--bg); border: 1px solid var(--line); border-radius: 7px; padding: 8px; margin-top: 10px; min-height: 60px; }
  .muted { color: var(--muted); font-size: 14px; }
</style>
</head>
<body>
<main>
  <section>
    <h1 id="title">A question for {{NAME}}</h1>
    <p>Someone tracking a piece of work asks you to confirm one thing. Only this question is shared with you.</p>
    <blockquote id="text">{{TEXT}}</blockquote>
    <div id="form">
      <textarea id="note" placeholder="Optional note (for example: confirmed, but only for the first batch)"></textarea>
      <div class="row">
        <button id="yes">Yes, this holds</button>
        <button id="no" class="quiet">No, it does not</button>
        <button id="unsure" class="quiet">I don't know</button>
      </div>
      <p class="muted">Your answer is recorded under your name in the task's record. The link works once.</p>
    </div>
    <p id="done" class="muted" hidden>Thank you. Your answer has been recorded.</p>
  </section>
</main>
<script>
"use strict";
const already = {{DONE}};
if (already) { document.getElementById("form").hidden = true; document.getElementById("done").hidden = false; }
async function send(answer) {
  for (const id of ["yes", "no", "unsure"]) document.getElementById(id).disabled = true;
  try {
    const r = await fetch(location.pathname, {method: "POST", headers: {"content-type": "application/json"},
                                               body: JSON.stringify({answer, note: document.getElementById("note").value})});
    const body = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(typeof body.detail === "string" ? body.detail : "could not record the answer");
    document.getElementById("form").hidden = true; document.getElementById("done").hidden = false;
  } catch (e) {
    document.getElementById("done").textContent = e.message; document.getElementById("done").hidden = false;
    for (const id of ["yes", "no", "unsure"]) document.getElementById(id).disabled = false;
  }
}
for (const id of ["yes", "no", "unsure"]) document.getElementById(id).onclick = () => send(id);
</script>
</body>
</html>
