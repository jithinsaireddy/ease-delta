# Deep update: continue the released edge model with verified corrections folded into the stream.
#
#   ease serve ...                                   (people correct readings as they work)
#   python -c "..."  Runtime.export_feedback(...)    (writes runs/feedback.jsonl from records that still exist)
#   python -m ease.train.stage_a --config configs/stage_a_continue.yaml
#   bash scripts/run_experiments.sh                  (the new weights go through the full evaluation before release)
#
# The new weights are a new `w:edge` version: every cached reading is invalidated when they are adopted.
run_dir: runs/stage_a_continued
eval_cache: runs/eval_cache
init_from: release/edge
encoder_name: answerdotai/ModernBERT-base
msg_dim: 128
pooling: cls
dropout: 0.1
max_len: 256
batch_size: 32
total_examples: 100000
lr: 1.0e-5
head_lr: 2.0e-5
weight_decay: 0.01
warmup_frac: 0.05
grad_clip: 1.0
seed: 4321
mixture:
  vitaminc: 0.35
  mnli: 0.22
  wanli: 0.10
  unrelated: 0.18
  feedback: 0.15
local_sources:
  feedback: runs/feedback.jsonl
shuffle_buffer: 1000000   # spans every corpus; a smaller buffer shuffles only locally
eval_every: 1000
ckpt_every: 1000
dev_sets: [vitaminc.dev, mnli.dev, unrelated.dev, snli.dev]
dev_limit: 2000
